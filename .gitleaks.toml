title = "OrcaXR Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Generated Snapmaker travel-point option identifiers are schema keys, not credentials."
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^travel_point_[1-3]_[xy]$''']
  paths = [
    '''^docs/parity/snapmaker-v2\.3\.4\.json$''',
    '''^web/src/settings/generated/engine-options\.schema\.json$''',
  ]

  [[rules.allowlists]]
  description = "Verified SHA-256 of the generated BBS filament option policy; the filename triggers generic-api-key in artifact input manifests."
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^959dddc0b5b697385cc7564328839222db493a14b721b94fa6a38289e801b2f2$''']
  paths = [
    '''^(core/browser/(project/)?|web/public/core(-project)?/[0-9a-f]{64}/)core-wasm-manifest\.json$''',
  ]
