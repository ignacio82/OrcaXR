org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Leave 3 cores free so the host stays usable during builds. The
# system has 16 cores; gradle/kotlin/ninja daemons collectively use
# at most 13, reserving 3 for the user's interactive shell, editor,
# browser, etc. Override at the command line via `--max-workers=N`
# for one-shot runs.
org.gradle.workers.max=13

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
