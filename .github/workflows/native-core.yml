name: Native Android and shared core

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Capture canonical slice inputs and verify published-engine references
        run: |
          npm --prefix wasm run verify:artifacts
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/native-engine/generate-slice-fixtures.mjs
          manifests=(tools/native-engine/build/fixtures/*/manifest.json)
          test "${#manifests[@]}" -eq 1
          node tools/native-engine/test-reference-inputs.mjs "${manifests[0]}"
          nice -n 10 node tools/native-engine/slice-reference.mjs "${manifests[0]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: canonical-native-slice-reference-evidence
          path: |
            tools/native-engine/build/fixtures/
            tools/native-engine/build/references/
          retention-days: 7

  engine-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.12'
      - name: Install the pinned NDK and native probe emulator
        run: sdkmanager 'ndk;29.0.14206865' 'system-images;android-34;google_apis;x86_64' 'emulator' 'platform-tools'
      - name: Build current-engine dependency probes from clean pinned source
        run: |
          python3 tools/native-engine/build-dependency-probes.py
          python3 tools/native-engine/build-dependency-probes.py --verify-only
          python3 tools/native-engine/test-dependency-package.py
      - name: Exercise native allocation and task scheduling on an owned emulator
        run: |
          sudo chmod a+rw /dev/kvm
          python3 tools/native-engine/emulator-probe.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-engine-dependency-evidence
          path: |
            tools/native-engine/results/
            tools/native-engine/build/recipes/*/*/package/manifest.json
          retention-days: 7

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Install locked Rust and binding tools
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown,aarch64-linux-android,x86_64-linux-android
          cargo +1.94.1 install wasm-bindgen-cli --version 0.2.129 --locked --jobs 2
          cargo +1.94.1 install cargo-audit --version 0.22.2 --locked --jobs 2
      - name: Verify generated contracts and source inventory
        run: |
          node tools/cross-platform/generate-contracts.mjs
          node tools/cross-platform/canonical-requests.mjs
          node tools/cross-platform/generate-gcode-layout.mjs
          node tools/cross-platform/generate-preview-catalog.mjs
          node tools/cross-platform/generate-view-layout.mjs
          node tools/cross-platform/generate-gcode-metadata.mjs
          node tools/cross-platform/generate-gcode-requests.mjs
          node tools/cross-platform/test-request-generator.mjs
          node tools/cross-platform/generate-project-intents.mjs
          node tools/cross-platform/generate-setting-scopes.mjs
          node tools/cross-platform/test-project-intent-generator.mjs
          node tools/cross-platform/project-intent-vectors.mjs
          node tools/cross-platform/package-browser-core.mjs
          node web/scripts/run-tests.mjs gcode-packets.test.ts core-gcode-source.test.ts gcode-requests.test.ts project-intents.test.ts project-session-transport.test.ts
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/bindings-test.mjs
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/canonical-vectors.mjs
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/project-id-vectors.mjs
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/asset-repository-vectors.mjs
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/facet-refinement-vectors.mjs
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/project-model-vectors.mjs
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/settings-resolution-vectors.mjs
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/validation-value-vectors.mjs
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/project-validation-vectors.mjs
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/gcode-vectors.mjs
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/preview-vectors.mjs
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/inspection-vectors.mjs
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/view-vectors.mjs
          node --import ./web/node_modules/tsx/dist/loader.mjs tools/cross-platform/inventory.mjs
      - name: Rust contracts and dependency checks
        working-directory: core
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked --jobs 2 -- -D warnings
          cargo test --workspace --locked --jobs 2
          cargo test -p orcaxr-gcode --test preview --test inspection --test views --test session --test requests --release --locked --jobs 2
          cargo test -p orcaxr-contracts --test project_intents --release --locked --jobs 2
          cargo test -p orcaxr-project --release --locked --jobs 2
          cargo run -p orcaxr-project --example asset_repository_benchmark --release --locked --jobs 2
          cargo run -p orcaxr-project --example facet_sparsity_benchmark --release --locked --jobs 2
          cargo run -p orcaxr-project --example project_model_benchmark --release --locked --jobs 2
          cargo run -p orcaxr-project --example settings_resolution_benchmark --release --locked --jobs 2
          cargo run -p orcaxr-project --example validation_values_benchmark --release --locked --jobs 2
          cargo run -p orcaxr-project --example project_validation_benchmark --release --locked --jobs 2
          cargo check -p orcaxr-project --lib --locked --jobs 2 --target wasm32-unknown-unknown
          cargo check -p orcaxr-project --lib --locked --jobs 2 --target aarch64-linux-android
          cargo check -p orcaxr-project --lib --locked --jobs 2 --target x86_64-linux-android
          cargo audit
      - name: Real browser worker and artifact checks
        run: |
          python3 tools/cross-platform/build-wasm.py
          python3 tools/cross-platform/verify-artifacts.py --wasm
          node tools/cross-platform/wasm-smoke.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: core-browser-evidence
          path: tools/cross-platform/results/
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.12'
      - name: Install locked native toolchain and emulator image
        run: |
          rustup toolchain install 1.94.1 --profile minimal --target aarch64-linux-android,x86_64-linux-android
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'system-images;android-34;google_apis;x86_64' 'emulator'
      - name: Build both ABIs, shrink release, verify dependencies, lint and test geometry/boundaries
        run: ./android/gradlew -p android :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :core-bridge:assembleDebugAndroidTest :core-bridge:testDebugUnitTest :renderer-api:testDebugUnitTest :app:lintDebug :xr-experiment:assembleDebug :xr-experiment:assembleDebugAndroidTest :renderer-scenecore:testDebugUnitTest :xr-experiment:lintDebug :renderer-scenecore:lintDebug --dependency-verification strict --no-daemon --console=plain
      - name: Verify every packaged ELF and APK alignment
        run: |
          python3 tools/cross-platform/verify-artifacts.py --apk android/app/build/outputs/apk/debug/app-debug.apk
          python3 tools/cross-platform/verify-artifacts.py --apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          python3 tools/cross-platform/verify-artifacts.py --apk android/xr-experiment/build/outputs/apk/debug/xr-experiment-debug.apk
      - name: Run JNI, non-XR startup, renderer pixels and lifecycle on an owned emulator
        run: |
          sudo chmod a+rw /dev/kvm
          python3 tools/renderer/emulator-smoke.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-core-evidence
          path: |
            tools/cross-platform/results/
            tools/renderer/results/
            android/app/build/reports/
            android/core-bridge/build/reports/
            android/renderer-api/build/reports/
            android/renderer-scenecore/build/reports/
            android/xr-experiment/build/reports/
            android/core-bridge/build/generated/core-native-manifest.json
          retention-days: 7
