name: Parity quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_container:
        description: Build the commit-pinned native slicer container
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  web:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run quality
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-quality-diagnostics
          path: |
            web/test-results/
            web/dist/
          if-no-files-found: ignore
          retention-days: 7

  parity:
    name: Upstream parity drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify generated manifest and mutation guards
        run: npm --prefix web run parity:verify
      - name: Verify structural 3MF and semantic G-code oracles
        run: npm --prefix web run parity:oracles

  server:
    name: External slicer service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run test:integration
        working-directory: server
      - run: npm audit --omit=dev --audit-level=high
        working-directory: server
      - name: Validate reproducible container definition
        run: docker compose -f server/docker-compose.yml config --quiet
        env:
          ORCAXR_SERVER_TOKEN: 0123456789abcdef0123456789abcdef
          ORCAXR_ALLOWED_ORIGINS: https://app.example

  wasm:
    name: Checked-in slicer artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: wasm/package-lock.json
      - run: npm ci
        working-directory: wasm
      - run: npm run verify:artifacts
        working-directory: wasm
      - run: npm run test:cube
        working-directory: wasm
      - run: npm run test:profile
        working-directory: wasm
      - run: npm run test:project
        working-directory: wasm
      - run: npm run test:painted
        working-directory: wasm
      - run: npm run test:painted-prime-tower
        working-directory: wasm
      - run: npm run test:fullspectrum
        working-directory: wasm
      - run: npm audit --omit=dev --audit-level=high
        working-directory: wasm

  build-container:
    name: Build commit-pinned native slicer
    if: github.event_name == 'workflow_dispatch' && inputs.build_container
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Build from the exact Snapmaker source commit
        run: docker compose -f server/docker-compose.yml build
        env:
          ORCAXR_SERVER_TOKEN: 0123456789abcdef0123456789abcdef
          ORCAXR_ALLOWED_ORIGINS: https://app.example

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
