name: Deploy Webapp to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

# Build and deploy are separate jobs on purpose. The Pages backend can reject a
# deployment with a bare "Deployment failed, try again later", and its own
# documented recovery is to re-run. With one combined job, `rerun --failed`
# uploads a second artifact named `github-pages` into the same run and
# `deploy-pages` aborts with "Multiple artifacts named ... Artifact count is 2",
# so the only recovery was an empty commit. Split, a retry re-runs `deploy`
# alone: no second upload, and no repeat of the ~7-minute quality gate.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Run release quality gate
        run: npm run quality
        working-directory: ./web

      - name: Build webapp
        run: ORCAXR_DEPLOY=1 npm run build
        working-directory: ./web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs"

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
