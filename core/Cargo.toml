[workspace]
members = ["crates/orcaxr-contracts", "crates/orcaxr-project", "crates/orcaxr-gcode", "crates/orcaxr-wasm", "crates/orcaxr-android"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[workspace.dependencies]
orcaxr-contracts = { path = "crates/orcaxr-contracts" }
orcaxr-gcode = { path = "crates/orcaxr-gcode" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
ryu-js = "=1.0.3"
libm = { version = "=0.2.16", default-features = false }
sha2 = "=0.10.9"
wasm-bindgen = "=0.2.129"
jni = "=0.21.1"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
