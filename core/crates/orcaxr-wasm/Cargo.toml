[package]
name = "orcaxr-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["gcode"]
gcode = ["dep:orcaxr-gcode"]
project = ["dep:orcaxr-project"]

[dependencies]
orcaxr-contracts.workspace = true
