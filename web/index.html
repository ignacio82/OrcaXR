<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>OrcaXR Web</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #14171a;
        color: #fff;
        overscroll-behavior: none;
      }
      button {
        cursor: pointer;
        pointer-events: auto;
      }
      /* XR Blocks injects its Enter-XR UI into #XRButtonWrapper — style it
         like the official samples so the button is unmissable. */
      #XRButtonWrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2.5rem;
        text-align: center;
        pointer-events: none;
      }
      #XRButtonWrapper > * {
        pointer-events: auto;
      }
      #XRButtonWrapper h1 {
        font-weight: 400;
        font-size: 2.5rem;
        margin: 0;
        color: #ffffff;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
      }
      .XRButton {
        background: linear-gradient(135deg, #ffb74d 0%, #ff6d00 100%);
        color: #000;
        border: none;
        border-radius: 9999px;
        font-weight: 500;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 26px 48px;
        min-width: 260px;
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.35);
        transition: transform 0.2s ease;
      }
      .XRButton:hover {
        transform: scale(1.03);
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
