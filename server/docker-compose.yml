services:
  orcaxr:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: orcaxr
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - HOST=127.0.0.1
      - PORT=3000
      - SLICER_ENGINE=cli
      - ORCAXR_TRUST=same-origin
    volumes:
      - orcaxr-data:/home/orcaxr/.orcaxr
    restart: unless-stopped
    stop_grace_period: 20s

  # Optional Tailscale Sidecar (Option B: runs tailscale serve with HTTPS)
  tailscale:
    image: tailscale/tailscale:v1.78.1
    container_name: orcaxr-tailscale
    network_mode: host
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/tailscale-serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/tailscale-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    profiles:
      - tailscale

volumes:
  orcaxr-data:
  tailscale-state:
