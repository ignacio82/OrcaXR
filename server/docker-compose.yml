version: '3.8'

services:
  orcaxr-server:
    build: .
    container_name: orcaxr-server-container
    ports:
      - "3000:3000"
    environment:
      # Slicing engine: "cli" (default) runs the official Snapmaker OrcaSlicer
      # AppImage — native 64-bit, latest upstream improvements. "wasm" runs the
      # same patched-libslic3r WASM build the browser uses (parity/debug fallback).
      - SLICER_ENGINE=cli
      # Max memory for the Node.js process and WASM runtime (in MB) — only
      # relevant when SLICER_ENGINE=wasm. The WebAssembly module itself (wasm32)
      # has a hard architectural limit of 4GB (4096MB) for its internal heap.
      - MAX_OLD_SPACE_SIZE=4096
      - PORT=3000
    restart: unless-stopped
