services:
  orcaxr:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: orcaxr
    init: true
    ports:
      # Published to the whole LAN, deliberately, and it must stay consistent
      # with the two settings below it: `HOST=0.0.0.0` plus
      # `ORCAXR_ACCEPT_LAN_EXPOSURE=yes-i-understand` is the server's own
      # acknowledgement that `same-origin` trust is being used off loopback,
      # which means **any machine on this network can slice without a token**
      # (server.js logs that warning on every boot). Publishing on 127.0.0.1
      # while the environment says otherwise was the worst of both: the
      # acknowledgement was on record and the port was still unreachable from
      # the headset or a phone.
      #
      # For a deployment that should NOT be open to the LAN, revert this to
      # "127.0.0.1:3000:3000" *and* drop ORCAXR_ACCEPT_LAN_EXPOSURE, then reach
      # it over Tailscale Serve (see docs/all-in-one-container-plan.md), or
      # switch to ORCAXR_TRUST=token with ORCAXR_SERVER_TOKEN and an explicit
      # ORCAXR_ALLOWED_ORIGINS.
      - "0.0.0.0:3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - SLICER_ENGINE=cli
      - ORCAXR_TRUST=same-origin
      - ORCAXR_ACCEPT_LAN_EXPOSURE=yes-i-understand
    volumes:
      - orcaxr-data:/home/orcaxr/.orcaxr
    restart: unless-stopped
    stop_grace_period: 20s

  # Optional Tailscale Sidecar (Option B: runs tailscale serve with HTTPS)
  tailscale:
    image: tailscale/tailscale:v1.78.1
    container_name: orcaxr-tailscale
    network_mode: host
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/tailscale-serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/tailscale-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    profiles:
      - tailscale

volumes:
  orcaxr-data:
  tailscale-state:
